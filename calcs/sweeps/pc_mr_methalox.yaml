# pc_mr_methalox.yaml
# -------------------
# Sweep chamber pressure (5–11 MPa) and O/F ratio (3.0–3.9) for the
# methalox 5 kN class engine.  Produces 4×4 = 16 design points.
#
# Run with:
#   python -m noyron sweep --config calcs/sweeps/pc_mr_methalox.yaml \
#       --parallel 4 --output output/pc_mr_sweep/
#
# Then visualise:
#   python calcs/plot_sweep.py output/pc_mr_sweep/results.csv

base:
  thrust: 5000.0           # N   (fixed across sweep)
  pc: 6894800.0            # Pa  (reference; overridden by variations)
  mr: 3.60                 # [-] (reference; overridden by variations)
  propellant: methalox
  epsilon: 10.605
  t_wall_max: 1500.0       # K  (Dittus-Boelter underpredicts h_c by 2-5x for transcritical CH4)
  dp_coolant: 5.0e6        # Pa (conservative budget with D-B coolant model)
  n_cycles: 100
  pump_margin: 2.0e6       # Pa

variations:
  chamber_pressure: [5.0e6, 7.0e6, 9.0e6, 11.0e6]   # 50–110 bar
  mixture_ratio:    [3.0, 3.3, 3.6, 3.9]

parallel: 1   # increase to available CPU count for faster runs
render: false
