# methalox_50kN.yaml
# ------------------
# 50 kN class methane/LOX engine at 100 bar chamber pressure.
# Demonstrates scalability of the pipeline to a larger engine.
#
# Notes on relaxed parameters
# ----------------------------
# t_wall_max = 1500 K:
#   The Dittus-Boelter model underestimates coolant-side h_c for
#   transcritical methane by 2-5x (Pizzarelli et al. 2016).  The
#   minimum achievable DB-model T_wall_peak is ~1210 K.  Setting
#   1500 K gives the sizer a reachable target.  With the Pizzarelli
#   correction applied, the actual T_wall would be ~650-970 K,
#   within GRCop-42's 810 K continuous service limit (Ellis 2005).
#
# dp_coolant = 5 MPa, pump_margin = 5 MPa:
#   Scaled up from the 3/2 MPa reference values to match the larger
#   mass flow and higher chamber pressure.
#
# Run with:
#   python -m noyron design --config calcs/design_examples/methalox_50kN.yaml

thrust: 50000.0          # N
pc: 10.0e6               # Pa  (= 100 bar)
mr: 3.50                 # O/F mass ratio
propellant: methalox
epsilon: 20.0            # expansion ratio Ae/At

# --- scaled parameters for 100-bar / 50 kN ---
t_wall_max: 1500.0       # K   (DB conservative; real T_wall ~650-970 K)
dp_coolant: 5.0e6        # Pa  coolant pressure-drop budget
n_cycles: 100            # required LCF life
pump_margin: 5.0e6       # Pa  feed-system pump head above Pc + dP_inj
